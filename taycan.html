<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Porsche taycan</title>
    <link rel="stylesheet" href="carros.css">
    <script defer src="carros.js"></script>
</head>
<body>

    <main class="pagina">
        <section class="hero">
            <img 
                src="https://www.avisprestige.com/images/carImage/cropped/porsche-taycan-large-2.png"
                alt="Porsche Taycan lateral"
                class="carro-lateral">
        </section>


        <section class="modelo">
            <h1>Taycan</h1>
            <img 
                src="https://www.webmotors.com.br/imagens/prod/348929/PORSCHE_TAYCAN_GTS_ELETRICO_34892913075951040.webp?s=fill&w=440&h=330&q=80&t=true"
                alt="Porsche Taycan frontal"
                class="carro-frontal">


            <div class="especificacao aceleracao">
                <strong>
                    3,8<span>s</span>
                </strong>
                <p>
                    Aceleração<br>
                    de 0 a 100
                </p>
            </div>


            <div class="especificacao desempenho">
                <strong>
                    240<span>Km/H</span>
                </strong>
                <p> velocidade máxima </p>
                <strong class="potencia">
                    598<span>CV</span>
                </strong>
            </div>
        </section>


        <section class="informacoes">
            <button class="ativo">2027</button>
            <button>eletrico</button>
            <button>tração integral</button>
            <button>automatico</button>
        </section>

        <section class="rodas">

            <article class="roda">
                <img 
                    src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRvRbU2wS3ulVS5UrsqUry40t7DeA6kvwWG4kBbsPCZB5UkyxpgOz1baLLR&s=10"
                    alt="Roda preta"
                >

                <div>
                    <h2>
                        Ro<span>DA</span>
                    </h2>

                    <p>
                        Conjunto de rodas de liga<br>
                        leve com design derivado<br>
                        do motorsport
                    </p>
                </div>
            </article>


            <article class="roda">
                <img 
                    src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRFZztFrGdGiTRNaw5v6-N5u9lsAbrSObTKrZZxBctdig&s=10"
                    alt="Roda prata"
                >
                <div>
                    <h2>
                        Ro<span>DA</span>
                    </h2>

                    <p>
                        Conjunto de rodas de liga<br>
                        leve com design de cinco<br>
                        raios de braço duplo
                    </p>
                </div>
            </article>
        </section>
    </main>

</body>
</html>
