<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Porsche Boxster</title>
    <link rel="stylesheet" href="carros.css">
    <script defer src="carros.js"></script>
</head>
<body>

    <main class="pagina">
        <section class="hero">
            <img 
                src="https://a.storyblok.com/f/322327/2616x712/bb2da0d0ae/718-boxster-side.png/m/1800x490/smart/filters:format(avif)"
                alt="Porsche Boxter lateral"
                class="carro-lateral">
        </section>


        <section class="modelo">
            <h1>Boxster</h1>
            <img 
                src="https://cdn.jdpower.com/ChromeImageGallery/Expanded/Transparent/640/2016PRC020003_640/2016PRC020003_640_05.png"
                alt="Porsche Boxter frontal"
                class="carro-frontal">


            <div class="especificacao aceleracao">
                <strong>
                    4,9<span>s</span>
                </strong>
                <p>
                    Aceleração<br>
                    de 0 a 100
                </p>
            </div>


            <div class="especificacao desempenho">
                <strong>
                    275<span>Km/H</span>
                </strong>
                <p> velocidade máxima </p>
                <strong class="potencia">
                    300<span>CV</span>
                </strong>
            </div>
        </section>


        <section class="informacoes">
            <button class="ativo">2024</button>
            <button>gasolina</button>
            <button>tração traseira</button>
            <button>automatico</button>
        </section>

        <section class="rodas">

            <article class="roda">
                <img 
                    src="https://leandrinistore.vteximg.com.br/arquivos/ids/412550-900-900/Jogo-Roda-GT7-Porsche-Boxster-Cayman-718-Aro-20-Preta-Diamantada.png?v=638182220139700000"
                    alt="Roda preta"
                >

                <div>
                    <h2>
                        Ro<span>DA</span>
                    </h2>

                    <p>
                        Conjunto de rodas de liga<br>
                        leve com design derivado<br>
                        do motorsport
                    </p>
                </div>
            </article>


            <article class="roda">
                <img 
                    src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ8N5WSk5ob2VZCGjdL2gZRceDBMqIexsvx8P9oVQoiCMoECvB5vuZTghIk&s=10"
                    alt="Roda prata"
                >
                <div>
                    <h2>
                        Ro<span>DA</span>
                    </h2>

                    <p>
                        Conjunto de rodas de liga<br>
                        leve com design de cinco<br>
                        raios de braço duplo
                    </p>
                </div>
            </article>
        </section>

</html>
